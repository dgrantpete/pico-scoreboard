[package]
name = "scoreboard-boot"
version = "0.1.0"
edition = "2024"
description = "The scoreboard's embassy-boot bootloader: swap, revert, and jump"

# Standalone workspace, for the same reason `firmware-rs/app` is one: embassy-rp
# only builds for the device. `../layout` is shared with the app and is a member
# of neither — see the root Cargo.toml.
[workspace]

[dependencies]
scoreboard-layout = { path = "../layout" }

# Pre-1.0 ecosystem: pinned exactly (SPEC.md §14). The pins are the ones the
# Phase 4 spike verified on this hardware; see boot-spike/PARTITIONS.md.
#
# No `embassy-boot/ed25519-dalek` here, and that is not an omission: with the
# feature on, verification happens in the *app*, inside
# `verify_and_mark_updated`, before a swap is ever requested. The bootloader
# does no verification at any pin, so adding the feature here would link a
# signature stack that never runs.
embassy-boot-rp = { version = "=0.10.0", features = ["defmt"] }
embassy-rp = { version = "=0.10.0", features = ["rt", "rp235xa", "critical-section-impl", "defmt"] }
embassy-sync = "=0.8.0"
embassy-time = "=0.5.1"
cortex-m = { version = "=0.7.7", features = ["inline-asm"] }
cortex-m-rt = "=0.7.6"
defmt = "=1.1.1"
defmt-rtt = "=1.3.0"
panic-probe = { version = "=1.0.0", features = ["print-defmt"] }

[build-dependencies]
scoreboard-layout = { path = "../layout", features = ["std"] }

[profile.release]
debug = 2
lto = "fat"
# "s", not 3: this binary has 32 KB to live in and does nothing that is
# performance-sensitive. The spike measured 12.2 KB at these settings.
opt-level = "s"
codegen-units = 1
