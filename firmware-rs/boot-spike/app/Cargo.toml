[package]
name = "spike-app"
version = "0.1.0"
edition = "2024"
description = "Minimal A/B trial-boot app images for the RP2350 embassy-boot spike"

[features]
# Bare `cargo build` gets a valid combination; the demo builds the variants
# explicitly (see demo/build.py).
default = ["identity-a", "confirm"]
# Exactly one identity: what the image calls itself over RTT.
identity-a = []
identity-b = []
# Confirm a trial boot (mark_booted after the health gate). A build WITHOUT
# this plays the "broken image": it logs, then hangs unfed until the
# bootloader's watchdog resets it and the bootloader reverts.
confirm = []
# Embed a payload image (env SPIKE_PAYLOAD = path to .bin) and stage it to
# DFU when the command mailbox says so.
stage = []
# Gate staging on ed25519 signature verification (env SPIKE_PAYLOAD_SIG =
# path to 64-byte detached signature). Enabling embassy-boot's verify
# feature REPLACES mark_updated() with verify_and_mark_updated().
verify = ["stage", "embassy-boot/ed25519-dalek"]

[dependencies]
spike-layout = { path = "../layout" }

# Pre-1.0 ecosystem: pinned exactly (SPEC.md §14).
embassy-boot-rp = { version = "=0.10.0", features = ["defmt"] }
# Direct dep only to reach its feature flags (verify); code comes through
# embassy-boot-rp's re-exports.
embassy-boot = { version = "=0.7.0", features = ["defmt"] }
embassy-executor = { version = "=0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-rp = { version = "=0.10.0", features = ["rt", "rp235xa", "critical-section-impl", "unstable-pac", "time-driver", "defmt"] }
embassy-sync = "=0.8.0"
embassy-time = { version = "=0.5.1", features = ["defmt"] }
embedded-storage = "=0.3.1"
cortex-m = { version = "=0.7.7", features = ["inline-asm"] }
cortex-m-rt = "=0.7.6"
defmt = "=1.1.1"
defmt-rtt = "=1.3.0"
panic-probe = { version = "=1.0.0", features = ["print-defmt"] }

[build-dependencies]
spike-layout = { path = "../layout", features = ["std"] }
