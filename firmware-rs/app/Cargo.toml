[package]
name = "scoreboard-app"
version = "0.1.0"
edition = "2024"
description = "The scoreboard firmware binary: embassy on both cores, render loop on core 1 driving the HUB75 panel"

# Standalone workspace: this binary only builds for thumbv8m (embassy-rp is
# device-only), so it must stay out of the root workspace's host builds — same
# arrangement as firmware-rs/hub75-diag. `../layout` used to live in here and
# be a member automatically; it moved out when `firmware-rs/boot` started
# needing the same table, because a bootloader depending on a crate inside the
# app reads as a mistake forever. It is a root-workspace member now, which is
# also what lets its host tests run in the ordinary `cargo test`.
[workspace]

[features]
# Where the image links. Exactly one; features are additive, so selecting the
# other needs --no-default-features (build.rs rejects both and neither).
default = ["link-standalone"]
# Flash offset 0, probe-flashed, no bootloader. Phase 3, and still the bench:
# `cargo run` over the probe, nothing staged or swapped. It must NEVER gain a
# bootloader dependency — that is the whole point of it surviving Phase 4.
link-standalone = []
# The active partition behind embassy-boot. What `tools/build.py publish-fw`
# ships, and the only profile that can install an update.
link-boot-integrated = ["dep:embassy-boot-rp", "dep:sha2"]

# Standalone mode (Phase S, SPEC §14): the firmware fetches from ESPN itself
# instead of from the backend, so every phase of the poll loop that assumed a
# backend needs a second implementation. Compile-time rather than a runtime flag
# — S3-DESIGN.md decision 1 — so `main` can carry both and ship neither by
# accident. What it selects so far is `net::sntp` in place of `GET /time`; the
# fetch, crest and timezone lanes add to it.
direct = []

# Bench instrument, off in every shipped build: once station mode is up, fetch
# `{DEV_API_URL}/time` over plain HTTP and log what came back. It exists to
# prove the stack moves bytes in both directions against the real backend
# without waiting for the client in task #11 — see `net::probe`.
net-probe = []

# Bench instrument, off in every shipped build: adds `POST /api/induce-panic`,
# which panics on purpose. It exists so the crash path — breadcrumb, reset,
# `/api/logs/previous` — can be exercised without waiting for a real bug, and a
# recovery path nobody has run is a recovery path that does not work.
induce-panic = []

[dependencies]
scoreboard-layout = { path = "../layout" }
hub75 = { path = "../../crates/hub75" }
scoreboard-model = { path = "../../crates/scoreboard-model" }
scoreboard-render = { path = "../../crates/scoreboard-render" }
# The `Accept` value that selects the packed format, and the decoders behind
# `GameFeed`. Already in the graph under `scoreboard-model`; named here because
# `net::api_client` sends the header itself.
scoreboard-wire = { path = "../../crates/scoreboard-wire" }

# Pre-1.0 ecosystem: pinned exactly (SPEC.md §14).
#
# NO-ALLOC WATCH (SPEC.md §10): `defmt` and `heapless` both carry an
# off-by-default `alloc` feature. Cargo unifies features across the whole
# graph, so one new dependency asking for `defmt/alloc` would make this binary
# demand a `#[global_allocator]` that does not exist, and the failure surfaces
# as an undefined `__rust_alloc` at link time with no hint as to who asked.
# Anything added here gets `cargo tree -f "{p} {f}"` run over it first.
rp235x-pac = { version = "=0.2.0", features = ["critical-section"] }
embassy-executor = { version = "=0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-rp = { version = "=0.10.0", features = ["rt", "rp235xa", "critical-section-impl", "time-driver", "defmt"] }
embassy-futures = "=0.1.2"
embassy-time = { version = "=0.5.1", features = ["defmt"] }
embassy-sync = { version = "=0.8.0", features = ["defmt"] }
cortex-m-rt = "=0.7.6"
static_cell = "=2.1.1"
heapless = "=0.9.3"
defmt = "=1.1.1"
defmt-rtt = "=1.3.0"
panic-probe = { version = "=1.0.0", features = ["print-defmt"] }

# Networking (SPEC §7.1). Feature notes, because each one costs sockets or RAM:
#   tcp/udp        — the socket types tasks #10/#11 and captive DNS/DHCP need
#   dhcpv4         — the *client*, for station mode. The AP-mode server is ours.
#   dhcpv4-hostname— sends option 12, which is what makes `<device_name>` resolve
#                    on the LAN the way `network.hostname()` did in MicroPython
#   dns            — the resolver. The backend is a `fly.dev` name whose address
#                    is not stable, so there is no reachable-by-IP alternative.
#                    Costs one socket slot, taken unconditionally by the stack.
#   medium-ethernet— cyw43 presents an Ethernet-like device
# `mdns` is *not* enabled, and Phase 4 found out why that mattered: DHCP option
# 12 only teaches the *router* the name, so a client that goes straight to
# multicast — which is most of them — never resolved it. MicroPython did not
# have this problem because its lwIP was compiled with LWIP_MDNS_RESPONDER. The
# responder is ours now (`net::mdns`, `scoreboard_portal::mdns`); embassy-net's
# feature stays off because the socket loop being ours is what keeps the
# never-die-on-a-bad-packet rule the same across all three responders.
#   multicast      — smoltcp's group membership, so the interface accepts
#                    traffic for 224.0.0.251. Without it `net::mdns` binds and
#                    receives nothing, which looks exactly like "no queries"
embassy-net = { version = "=0.9.1", features = ["defmt", "tcp", "udp", "dns", "dhcpv4", "dhcpv4-hostname", "proto-ipv4", "medium-ethernet", "multicast"] }
# `firmware-logs` surfaces the CYW43's own console over defmt. It is how a join
# failure inside the chip is diagnosed at all, and it costs flash, not RAM.
cyw43 = { version = "=0.7.0", features = ["defmt", "firmware-logs"] }
cyw43-pio = { version = "=0.10.0", features = ["defmt"] }
# Protocol only — `default-features = false` drops the `io` feature and with it
# edge-nal, so nothing but the packet codec and the lease table links. The
# socket loop is ours (`net::dhcp_server`), which is what keeps the
# never-die-on-a-bad-packet rule the same as the captive DNS responder's.
edge-dhcp = { version = "=0.8.0", default-features = false, features = ["defmt"] }
scoreboard-portal = { version = "0.1.0", path = "../../crates/scoreboard-portal" }
scoreboard-config = { path = "../../crates/scoreboard-config" }
scoreboard-log = { path = "../../crates/scoreboard-log" }
# The button driver's PIO program and its consumer logic, the league menu
# session, and the brightness curve — the pure half of task #12, host-tested
# against `tools/pio_sim.py`'s scenarios and `brightness.py`'s values.
scoreboard-input = { path = "../../crates/scoreboard-input" }
# The OTA client's decisions and its signature check (SPEC §8), host-tested
# there against a vector `tools/fwsign.py` produced.
scoreboard-ota = { path = "../../crates/scoreboard-ota" }
# Persistence (SPEC §9). `default-features = false` is the whole point: the
# default set is empty here, but `alloc`, `std`, `arrayvec`, `postcard` and the
# `heapless` value impls all exist and every one of them would add a dependency
# for a convenience this crate does not need — the two values stored are a JSON
# document and a hand-encoded breadcrumb, both `&[u8]`.
sequential-storage = { version = "=8.0.1", default-features = false, features = ["defmt"] }
# A/B OTA (SPEC §8). Only under `link-boot-integrated`: its
# `from_linkerfile_blocking` resolves the `__bootloader_*` symbols, which the
# standalone profile deliberately does not emit, so a standalone build that
# reached the OTA path would fail to link — the intended outcome.
#
# NOT `features = ["ed25519-dalek"]`, and `scoreboard_ota::verify`'s module docs
# carry the whole argument: that feature's `verify_and_mark_updated` hashes
# through a hardcoded two-byte buffer in one un-feedable blocking call, and the
# bootloader's 8 s watchdog cannot be disarmed.
embassy-boot-rp = { version = "=0.10.0", features = ["defmt"], optional = true }
# The `Digest` impl handed to `BlockingFirmwareUpdater::hash`. `asm` stays off:
# it has no thumbv8m backend, and the pure-Rust one is what the measurement in
# the ring log reports.
sha2 = { version = "=0.10.9", default-features = false, optional = true }
# `NorFlash`, for the one flash handle `storage` lends out.
embedded-storage = "=0.3.1"
# `adapter::BlockingAsync`, which is the only piece of it linked: embassy-rp's
# Flash implements the *blocking* `NorFlash` traits and sequential-storage's map
# API is async, so one of the two has to be adapted. See `storage`'s module docs
# for why adapting the blocking side is not a lie about what happens.
embassy-embedded-hal = { version = "=0.6.0", features = ["defmt"] }
# The HTTP server (SPEC §7.3). `default-features = false` is load-bearing: the
# default set includes `std`, which enables `alloc`. `embassy` selects the
# timer and the embassy-net socket glue; `json` adds `serde-json-core` for the
# response bodies. `ws` and `log` stay off — no websockets, and defmt is the
# log channel.
picoserve = { version = "=0.19.0", default-features = false, features = ["embassy", "defmt", "json"] }
# Response bodies are serialized straight into a caller-owned slice.
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-json-core = "=0.6.0"
# The PIO clock divider's 16.8 fixed-point type. embassy-rp takes it by value in
# `pio::Config` and does not re-export the crate, so it is named here; already in
# the graph under embassy-rp and cyw43-pio.
fixed = "=1.30.0"
# `msp` / `msplim`, for the core-0 stack watermark and the static-RAM figure in
# `/api/status`, and `SCB::sys_reset` for `/api/reboot`. Already in the graph
# under rp235x-pac; named here because this crate calls it directly.
cortex-m = "=0.7.8"
# `Read`, for streaming an OTA image out of reqwless's body reader a chunk at a
# time — a ~700 KB image on a 512 KB device has no other shape. Also the
# `Read`/`Write` traits `net-probe` uses against a raw TcpSocket.
embedded-io-async = "=0.7.0"
# The backend client (SPEC §7.4). `default-features = false` drops
# `embedded-tls`, which is the whole reason the dependency is affordable: score
# polling is plain HTTP by design (`api_client.py:94`), so the TLS stack, its
# 21 KB of record buffers and its certificate machinery never link. reqwless
# still *names* `p256` and `rand_chacha` unconditionally, but every use of them
# is behind `cfg(feature = "embedded-tls")`, so LTO strips the lot — verified in
# the size report, where the image grew by the HTTP codec and nothing else.
#
# `defmt` here resolves to the `0.3.100` shim, which re-exports `defmt` 1.x, so
# there is one defmt runtime in the image and not two.
reqwless = { version = "=0.14.0", default-features = false, features = ["defmt"] }
# reqwless's error type carries an `embedded_io::ErrorKind`, which the poller
# maps onto its own transport vocabulary. Same crate embassy-net and picoserve
# already pull in.
embedded-io = "=0.7.1"

[build-dependencies]
scoreboard-layout = { path = "../layout", features = ["std"] }
# Host-side only: hashes the embedded web bundle into its ETag. Zero
# dependencies, and already in the target graph via picoserve, so it adds no
# new audit surface.
const-sha1 = "=0.3.0"

[profile.release]
debug = 2
lto = "fat"
opt-level = 3
codegen-units = 1

# picoserve's internal select/select_either were async fns taking futures by
# value, which triples the per-request future in every connection task's
# arena (BUDGET.md, the 2026-08-17 addendum). Pinned to the fork carrying
# the named-struct fix. Upstream fixed the same duplication independently on
# its development branch (47be022 "Store select/select_either futures once",
# unreleased as of 0.19.0) — do NOT file a PR; drop this patch when the next
# release lands.
[patch.crates-io]
picoserve = { git = "https://github.com/dgrantpete/picoserve", rev = "5f21fe115ee02ee2c504cd3101e8fcb54415b01e" }
