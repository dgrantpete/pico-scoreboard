[package]
name = "hub75-diag"
version = "0.1.0"
edition = "2024"
description = "Bench flash-test binary for crates/hub75: test patterns on a Pico 2 W"

# Standalone workspace: this binary only builds for thumbv8m (embassy-rp is
# device-only), so it must stay out of the root workspace's host builds.
[workspace]

[dependencies]
hub75 = { path = "../../crates/hub75" }

# Pre-1.0 ecosystem: pinned exactly (SPEC.md §14).
rp235x-pac = { version = "=0.2.0", features = ["critical-section"] }
embassy-executor = { version = "=0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-rp = { version = "=0.10.0", features = ["rt", "rp235xa", "critical-section-impl", "time-driver", "defmt"] }
embassy-time = { version = "=0.5.1", features = ["defmt"] }
cortex-m-rt = "=0.7.6"
static_cell = "=2.1.1"
defmt = "=1.1.1"
defmt-rtt = "=1.3.0"
panic-probe = { version = "=1.0.0", features = ["print-defmt"] }

[profile.release]
debug = 2
lto = "fat"
opt-level = 3
codegen-units = 1
