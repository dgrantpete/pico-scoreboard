[package]
name = "tls-spike"
version = "0.1.0"
edition = "2024"
description = "S2 on-silicon TLS bring-up: embedded-tls handshake, keep-alive, and RAM numbers on the RP2350 (PHASE-S-CHECKLIST.md, S2)"

# Standalone workspace, same reasoning as bench and hub75-diag: device-only
# deps must stay out of the root workspace's host builds.
[workspace]

[dependencies]
# Pre-1.0 ecosystem: pinned exactly, mirroring firmware-rs/app (SPEC.md §14).
embassy-executor = { version = "=0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-rp = { version = "=0.10.0", features = ["rt", "rp235xa", "critical-section-impl", "time-driver", "defmt"] }
embassy-time = { version = "=0.5.1", features = ["defmt"] }
embassy-net = { version = "=0.9.1", features = ["defmt", "tcp", "udp", "dns", "dhcpv4", "proto-ipv4", "medium-ethernet"] }
cyw43 = { version = "=0.7.0", features = ["defmt", "firmware-logs"] }
cyw43-pio = { version = "=0.10.0", features = ["defmt"] }
cortex-m-rt = "=0.7.6"
static_cell = "=2.1.1"
defmt = "=1.1.1"
defmt-rtt = "=1.3.0"
panic-probe = { version = "=1.0.0", features = ["print-defmt"] }
rand_core = "=0.6.4"
embedded-io-async = "=0.7.0"

# The subject under test: the app's pinned HTTP client with its TLS feature
# on. reqwless =0.14 pulls embedded-tls 0.18 (rustpki verification, no
# alloc). The rsa feature is deliberately OFF: it requires alloc, and
# whether the firmware ever turns it on is the S2 design decision this
# spike produces numbers for.
reqwless = { version = "=0.14.0", default-features = false, features = ["embedded-tls", "defmt"] }

[profile.release]
debug = 2
lto = "fat"
opt-level = 3
codegen-units = 1

# embedded-tls 0.18.0 as published cannot build against today's crates.io
# (it requires der 0.8.0-rc.2, whose rc-era API is gone; upstream PR #196
# fixes main but no release carries it), and its default config only
# advertises RSA signature schemes with alloc on — which locks a no-verify
# client out of RSA-certified hosts like ESPN entirely. The fork carries
# both fixes; drop this pin when a release + a reqwless bump cover them
# (stewardship ledger, BACKLOG 97).
[patch.crates-io]
embedded-tls = { git = "https://github.com/dgrantpete/embedded-tls", rev = "c7d1aa27abbfd683383e9d696b7f51fb0f2c924f" }
