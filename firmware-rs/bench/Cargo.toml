[package]
name = "espn-bench"
version = "0.1.0"
edition = "2024"
description = "On-silicon timing bench for Phase S local processing: streaming ESPN extraction (and png-stream when it lands) on the RP2350"

# Standalone workspace, same reasoning as hub75-diag: device-only deps must
# stay out of the root workspace's host builds.
[workspace]

[dependencies]
scoreboard-espn = { path = "../../crates/scoreboard-espn" }
scoreboard-wire = { path = "../../crates/scoreboard-wire" }

# Pre-1.0 ecosystem: pinned exactly (SPEC.md §14), mirroring hub75-diag.
embassy-executor = { version = "=0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-rp = { version = "=0.10.0", features = ["rt", "rp235xa", "critical-section-impl", "time-driver", "defmt"] }
embassy-time = { version = "=0.5.1", features = ["defmt"] }
cortex-m-rt = "=0.7.6"
static_cell = "=2.1.1"
defmt = "=1.1.1"
defmt-rtt = "=1.3.0"
panic-probe = { version = "=1.0.0", features = ["print-defmt"] }

# Same pin as the root workspace: the PushParser per-call-lifetime fix
# (kaidokert/picojson-rs#98). Standalone workspaces don't inherit the root
# [patch.crates-io], so it is repeated here.
[patch.crates-io]
picojson = { git = "https://github.com/dgrantpete/picojson-rs", rev = "4fd6eeac86cc4757c9cc07e41dde4398d85e3249" }

[profile.release]
debug = 2
lto = "fat"
opt-level = 3
codegen-units = 1
