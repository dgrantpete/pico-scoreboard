# Non-secret defaults (safe to commit to git)
# Secrets like api_key should be set via environment variables (APP_API_KEY)

[server]
host = "0.0.0.0"
port = 3000

[espn]
base_url = "https://site.api.espn.com/apis/site/v2/sports"
logo_url = "https://a.espncdn.com"
# ESPN's edge (Akamai) 403s unrecognized User-Agents; only known dev-tool
# prefixes (curl/*, python-requests/*) pass, so lead with one and keep our
# identity as a suffix. Verified empirically 2026-08-07.
user_agent = "python-requests/2.32.3 pico-scoreboard/1.0"
timeout_secs = 10

[geoip]
mmdb_path = "/app/GeoLite2-City.mmdb"
