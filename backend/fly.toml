app = "pico-scoreboard-api-dgrantpete"
primary_region = "iad"

# Build context is the REPO ROOT (workspace member + path dependency on
# crates/scoreboard-wire); deploy with `fly deploy . --config backend/fly.toml`
# from the root, which tools/build.py does. NOTE: these paths resolve relative
# to THIS file, not the build context.
[build]
dockerfile = "Dockerfile"
ignorefile = "Dockerfile.dockerignore"

[env]
RUST_LOG = "info"
LOG_FORMAT = "json"

[http_service]
internal_port = 3000
# Plain HTTP is intentionally served (no 80 -> 443 redirect): the scoreboard
# polls game data over http:// to avoid ~21 KB of standing mbedTLS buffers on
# the Pico. The /app/* OTA endpoints remain API-key'd and are only ever
# fetched over https by the device (ota.py).
force_https = false
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 1

[http_service.http_options]
idle_timeout = 120

[[http_service.checks]]
grace_period = "10s"
interval = "15s"
method = "GET"
timeout = "5s"
path = "/health"

[[vm]]
size = "shared-cpu-1x"
memory = 256