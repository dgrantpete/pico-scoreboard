openapi: 3.1.0
info:
  title: ESPN Scoreboard API (Mlb + Nba + FifaWorld + Wnba)
  description: Empirically-derived OpenAPI 3.1 spec for ESPN's scoreboard endpoints. Each sport's Competition schema is a
    discriminated union over status.type.state (pre/in/post). Schemas structurally identical across every sport are merged
    into shared components.
  version: 1.0.0
servers:
- url: https://site.api.espn.com/apis/site/v2
paths:
  /sports/baseball/mlb/scoreboard:
    get:
      summary: Get MLB scoreboard for a date
      parameters:
      - name: dates
        in: query
        description: Date in YYYYMMDD format
        schema:
          type: string
          pattern: ^\d{8}$
      responses:
        '200':
          description: Scoreboard response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MlbScoreboardResponse'
  /sports/basketball/nba/scoreboard:
    get:
      summary: Get NBA scoreboard for a date
      parameters:
      - name: dates
        in: query
        description: Date in YYYYMMDD format
        schema:
          type: string
          pattern: ^\d{8}$
      responses:
        '200':
          description: Scoreboard response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NbaScoreboardResponse'
  /sports/soccer/fifa.world/scoreboard:
    get:
      summary: Get FIFA.WORLD scoreboard for a date
      parameters:
      - name: dates
        in: query
        description: Date in YYYYMMDD format
        schema:
          type: string
          pattern: ^\d{8}$
      responses:
        '200':
          description: Scoreboard response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FifaWorldScoreboardResponse'
  /sports/basketball/wnba/scoreboard:
    get:
      summary: Get WNBA scoreboard for a date
      parameters:
      - name: dates
        in: query
        description: Date in YYYYMMDD format
        schema:
          type: string
          pattern: ^\d{8}$
      responses:
        '200':
          description: Scoreboard response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WnbaScoreboardResponse'
