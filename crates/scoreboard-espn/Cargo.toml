[package]
name = "scoreboard-espn"
version = "0.1.0"
edition = "2021"
description = "Shared ESPN-JSON → game-model transform: streaming path tables over picojson (Phase S1)"

# picojson resolves to the fork carrying the PR #98 lifetime fix via the
# workspace-root [patch.crates-io] until an upstream release includes it.
[dependencies]
picojson = "0.2.3"
heapless = "0.9.3"
scoreboard-wire = { path = "../scoreboard-wire" }

[dev-dependencies]
# The oracle for parse_start_time's property tests only; never shipped.
chrono = "0.4"
