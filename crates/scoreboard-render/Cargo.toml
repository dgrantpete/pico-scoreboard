[package]
name = "scoreboard-render"
version = "0.1.0"
edition = "2024"
description = "Fonts, sprites, screen geometry and the pixel path that turns a ScoreboardSnapshot into a 128x64 RGB888 frame"

[dependencies]
scoreboard-model = { path = "../scoreboard-model" }
# Pre-1.0 ecosystem: pinned exactly (SPEC.md §14). Default features only —
# `alloc` stays off (SPEC.md §10).
heapless = "=0.9.3"
# no_std, zero dependencies, `forbid(unsafe_code)`, every buffer caller-owned.
# Audited in SPEC.md Appendix A.
qrcodegen-no-heap = "=1.8.1"
# `sqrtf` and `roundf` for the court's three-point arc and its projection
# (`court.rs`). `core` has neither on stable; the same version, for the same
# reason, as `crates/hub75` (`pow` for the gamma LUT) and `scoreboard-input`
# (`logf` for the lux curve). `sqrtf` is correctly rounded and `roundf` is
# exact, so the court draws the bytes the std-built mockup drew.
libm = "=0.2.16"

[dev-dependencies]
# The render target for pixel assertions. A dev-dependency on purpose: the
# shipping graph of this crate must not pull a PAC in (SPEC §2's crate
# boundary rule). `geometry` pins its constants against hub75's under `cfg(test)`
# so the two cannot drift.
hub75 = { path = "../hub75", features = ["simulator"] }
# The hockey screens' pixel tests commit hand-built wire games through the
# real model, until the backend's hockey goldens exist.
scoreboard-wire = { path = "../scoreboard-wire" }
# Reads the art tests' 8-bit RGBA PNGs (`tests/art/`, `art/`): the true-colour
# oracle the procedural replacements are pinned to (BACKLOG 116). Test-only;
# the version the backend's `image` already locks, pinned exactly per SPEC §14.
png = "=0.18.0"
