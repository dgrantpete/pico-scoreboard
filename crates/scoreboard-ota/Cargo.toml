[package]
name = "scoreboard-ota"
version = "0.1.0"
edition = "2024"
description = "The OTA client's pure half: the manifest, the update decision, the attempt record, and the signature check"

[dependencies]
# Pre-1.0 ecosystem: pinned exactly (SPEC.md §14). Default features only —
# `alloc` stays off (SPEC.md §10).
heapless = "=0.9.3"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-json-core = "=0.6.0"
# The signature check. `default-features = false` drops `std` and `zeroize`, and
# keeps the curve25519-dalek backend that does not need them. This is the same
# crate `embassy-boot/ed25519-dalek` would have pulled in, so it is not new
# audit surface; see `verify`'s module docs for why the check is ours rather
# than embassy-boot's.
ed25519-dalek = { version = "=2.2.0", default-features = false }

[dev-dependencies]
# The cross-language vector in tests/signature.rs hashes on the host.
sha2 = "0.10"
hex = "0.4"
