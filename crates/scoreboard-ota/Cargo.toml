[package]
name = "scoreboard-ota"
version = "0.1.0"
edition = "2024"
description = "The OTA client's pure half: the manifest, the update decision, and the attempt record — with no flash and no socket in sight"

[dependencies]
# Pre-1.0 ecosystem: pinned exactly (SPEC.md §14). Default features only —
# `alloc` stays off (SPEC.md §10).
heapless = "=0.9.3"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-json-core = "=0.6.0"

[dev-dependencies]
# Host-only, and only for the one test that matters most: that `tools/fwsign.py`
# and `embassy-boot`'s ed25519 adapter agree on what a signature is. See
# `tests/signature.rs`.
ed25519-dalek = "2"
sha2 = "0.10"
hex = "0.4"
