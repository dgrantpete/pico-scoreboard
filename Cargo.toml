[workspace]
resolver = "3"
# `firmware-rs/layout` is here rather than in a device workspace because it is
# shared by two of them — `firmware-rs/app` and `firmware-rs/boot` are each
# standalone (embassy-rp does not build for the host) and both generate their
# `memory.x` from its constants. It is pure `no_std` arithmetic with host tests
# behind a `std` feature, so it belongs where `cargo test` already runs.
members = ["backend", "crates/*", "firmware-rs/layout"]

# scoreboard-espn's tokenizer, pinned to the fork carrying the PushParser
# per-call-input-lifetime fix (kaidokert/picojson-rs#98, filed from this
# project). Drop this patch when an upstream release includes the fix.
[patch.crates-io]
picojson = { git = "https://github.com/dgrantpete/picojson-rs", rev = "4fd6eeac86cc4757c9cc07e41dde4398d85e3249" }
