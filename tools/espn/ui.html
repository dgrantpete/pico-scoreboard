<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESPN pipeline viewer</title>
<style>
  :root {
    --ink: #1f2328; --ink-2: #57606a; --ink-3: #8b949e;
    --surface: #ffffff; --surface-2: #f6f8fa; --border: #d8dee4;
    --accent: #0969da;
    --band-req-bg: #1a7f37; --band-req-ink: #ffffff;
    --band-sub-bg: #fdf0ef; --band-sub-ink: #8b1a1a;
    --band-abs-bg: #f6f8fa; --band-abs-ink: #a5adb6;
    --live: #1a7f37;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--surface-2); color: var(--ink);
    font: 14px/1.45 system-ui, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 20px;
    padding: 12px 24px; background: var(--surface); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 3;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  nav a { color: var(--ink-2); text-decoration: none; margin-right: 14px; padding: 4px 2px; }
  nav a.active { color: var(--ink); font-weight: 600; border-bottom: 2px solid var(--accent); }
  main { padding: 20px 24px 60px; max-width: 1200px; margin: 0 auto; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); margin: 22px 0 8px; }
  .banner { background: #fff8c5; border: 1px solid #d4a72c66; padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; display: none; }
  .tiles { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .tile {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 16px; min-width: 130px;
  }
  .tile .v { font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
  .tile .k { font-size: 11px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .05em; }
  table { border-collapse: collapse; width: 100%; background: var(--surface); border: 1px solid var(--border); }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { background: var(--surface-2); color: var(--ink-2); font-weight: 600; font-size: 12px; position: sticky; top: 46px; cursor: default; box-shadow: 0 1px 0 var(--border); }
  th.sortable { cursor: pointer; }
  th.sortable:hover { color: var(--ink); }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
  .muted { color: var(--ink-3); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: baseline; }
  .dot.live { background: var(--live); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .chip {
    display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11.5px;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--ink-2); margin-right: 4px;
  }
  .chip.dim { opacity: .45; }
  .kind { font-size: 11px; padding: 1px 7px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface-2); color: var(--ink-2); }
  .controls { display: flex; gap: 10px; align-items: center; margin: 10px 0; flex-wrap: wrap; }
  select, input[type="search"] {
    font: inherit; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface);
  }
  input[type="search"] { width: 300px; }
  td.band { text-align: right; font-variant-numeric: tabular-nums; min-width: 72px; }
  details { margin: 4px 0; }
  details.tree-node { margin-left: 0; }
  details.tree-node > details, .tree-kids { margin-left: 22px; }
  summary { cursor: pointer; }
  .node-head { font-weight: 600; }
  .node-stats { color: var(--ink-2); font-weight: 400; font-size: 12.5px; }
  .leaf { color: var(--ink-2); margin-left: 22px; padding: 1px 0; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; margin-bottom: 14px; }
  .mini { margin-top: 8px; }
  .mini table { width: auto; }
  a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>ESPN pipeline</h1>
  <nav id="nav">
    <a href="#/dashboard" data-view="dashboard">Dashboard</a>
    <a href="#/presence" data-view="presence">Presence</a>
    <a href="#/discover" data-view="discover">Discover</a>
    <a href="#/artifacts" data-view="artifacts">Artifacts</a>
  </nav>
</header>
<main>
  <div class="banner" id="banner"></div>
  <div id="view"></div>
</main>
<script>
"use strict";
const $ = (sel, el) => (el || document).querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtBytes = n => n >= 1e9 ? (n/1e9).toFixed(2)+" GB" : n >= 1e6 ? (n/1e6).toFixed(1)+" MB" : n >= 1e3 ? (n/1e3).toFixed(0)+" KB" : n+" B";
const fmtAge = s => s < 90 ? Math.round(s)+"s" : s < 5400 ? Math.round(s/60)+"m" : Math.round(s/3600)+"h";
const fmtInt = n => Number(n).toLocaleString("en-US");

async function api(path) {
  const resp = await fetch(path);
  if (!resp.ok) throw new Error(path + " -> HTTP " + resp.status);
  return resp.json();
}
function banner(msg) {
  const el = $("#banner");
  el.style.display = msg ? "block" : "none";
  el.textContent = msg || "";
}

/* ---------- presence color bands (values are always printed; color reinforces) */
function bandCell(pct) {
  if (pct === 100) return `<td class="band" style="background:var(--band-req-bg);color:var(--band-req-ink)">100</td>`;
  if (pct >= 1) {
    const a = 0.12 + 0.42 * pct / 100;
    return `<td class="band" style="background:rgba(180,124,0,${a.toFixed(2)});color:#4d3800">${pct.toFixed(pct < 10 ? 1 : 0)}</td>`;
  }
  if (pct > 0) return `<td class="band" style="background:var(--band-sub-bg);color:var(--band-sub-ink)">&lt;1</td>`;
  return `<td class="band" style="background:var(--band-abs-bg);color:var(--band-abs-ink)">&ndash;</td>`;
}
function signature(f) {
  const states = ["pre", "in", "post"].filter(s => (f[s]?.pct ?? 0) >= 1);
  if (states.length === 3) return "all";
  if (states.length === 0) return "—";
  return states.join("+");
}

/* ---------- routing */
const views = {};
function route() {
  const hash = location.hash || "#/dashboard";
  const [, view, arg] = hash.split("/");
  document.querySelectorAll("#nav a").forEach(a =>
    a.classList.toggle("active", a.dataset.view === view));
  banner("");
  (views[view] || views.dashboard)(arg ? decodeURIComponent(arg) : null);
}
window.addEventListener("hashchange", route);

/* ---------- dashboard */
let dashTimer = null;
views.dashboard = async function () {
  if (!dashTimer) {
    dashTimer = setInterval(() => {
      if ((location.hash || "#/dashboard").includes("dashboard") && document.visibilityState === "visible")
        views.dashboard();
    }, 10_000);
  }
  let d;
  try { d = await api("/api/dashboard"); }
  catch (e) { banner("dashboard fetch failed: " + e.message); return; }
  if (!d.available) {
    $("#view").innerHTML = `<div class="card">No database at <span class="mono">${esc(d.db_path)}</span> yet — run a collect first.</div>`;
    return;
  }
  const t = d.totals;
  const liveCount = d.leagues.filter(l => l.live).length;
  const rows = d.leagues.map(l => {
    const states = l.states
      ? ["in", "pre", "post"].map(s => l.states[s] ? `<span class="chip">${l.states[s]} ${s}</span>` : "").join("")
      : "";
    const status = l.live
      ? `<span class="dot live"></span><strong>LIVE</strong>`
      : l.age_seconds != null ? `<span class="muted">idle &middot; ${fmtAge(l.age_seconds)} ago</span>` : `<span class="muted">&mdash;</span>`;
    return `<tr>
      <td>${esc(l.sport)}</td><td class="mono">${esc(l.league)}</td>
      <td>${status}</td><td>${states}</td>
      <td class="num">${fmtInt(l.polls)}</td><td class="num">${fmtInt(l.distinct)}</td>
      <td class="num">${fmtInt(l.changed)}</td><td class="num">${l.dates}</td>
      <td class="num">${l.non_200 ? l.non_200 : '<span class="muted">0</span>'}</td>
      <td class="muted mono">${esc((l.first || "").slice(0, 10))} .. ${esc((l.last || "").slice(0, 16))}</td>
    </tr>`;
  }).join("");
  $("#view").innerHTML = `
    <div class="tiles">
      <div class="tile"><div class="v">${d.leagues.length}</div><div class="k">leagues</div></div>
      <div class="tile"><div class="v">${liveCount}</div><div class="k">live now</div></div>
      <div class="tile"><div class="v">${fmtInt(t.bodies)}</div><div class="k">unique bodies</div></div>
      <div class="tile"><div class="v">${fmtBytes(t.raw_bytes)} &rarr; ${fmtBytes(t.stored_bytes)}</div><div class="k">raw &rarr; stored</div></div>
      <div class="tile"><div class="v">${fmtBytes(t.db_bytes)}</div><div class="k">db file (wal ${fmtBytes(t.wal_bytes)})</div></div>
    </div>
    <h2>Leagues</h2>
    <table><thead><tr>
      <th>sport</th><th>league</th><th>status</th><th>last body states</th>
      <th class="num">polls</th><th class="num">distinct</th><th class="num">changes</th>
      <th class="num">dates</th><th class="num">non-200</th><th>first .. last (UTC)</th>
    </tr></thead><tbody>${rows}</tbody></table>`;
};

/* ---------- artifact pickers */
async function artifactSelect(kind, selected, hashPrefix) {
  const { files } = await api("/api/artifacts");
  const options = files.filter(f => f.kind === kind);
  if (!options.length) return { html: `<div class="card">No ${kind} artifacts yet — run the pipeline first.</div>`, name: null };
  const name = selected && options.some(f => f.name === selected) ? selected : options[0].name;
  const html = `<div class="controls"><label>${kind} file:
    <select onchange="location.hash='#/${hashPrefix}/'+encodeURIComponent(this.value)">
      ${options.map(f => `<option ${f.name === name ? "selected" : ""}>${esc(f.name)}</option>`).join("")}
    </select></label></div>`;
  return { html, name };
}

/* ---------- presence explorer */
views.presence = async function (arg) {
  const picker = await artifactSelect("presence", arg, "presence");
  if (!picker.name) { $("#view").innerHTML = picker.html; return; }
  const doc = await api("/api/artifact/" + encodeURIComponent(picker.name));
  const totals = doc._state_totals || {};
  const fields = Object.entries(doc.fields || {}).map(([path, f]) => ({ path, f, sig: signature(f) }));
  const chips = Object.entries(totals).map(([s, n]) => `<span class="chip">${esc(s)}: ${fmtInt(n)}</span>`).join("");

  $("#view").innerHTML = `
    ${picker.html}
    <div class="card">state totals: ${chips} <span class="muted">&middot; ${fmtInt(fields.length)} field paths &middot;
      bands: <b>100</b> required &middot; shaded = variant member (&ge;1%) &middot; <b>&lt;1</b> sub-threshold (glitch, not a member) &middot; &ndash; absent</span></div>
    <div class="controls">
      <input type="search" id="pfilter" placeholder="filter paths (substring)">
      <select id="ppreset">
        <option value="all">All fields</option>
        <option value="variant">Variant fields (state-dependent)</option>
        <option value="required">Required everywhere</option>
        <option value="sub">Has sub-threshold presence</option>
      </select>
      <span class="muted" id="pcount"></span>
    </div>
    <table><thead><tr>
      <th class="sortable" data-k="path">path</th>
      <th class="num sortable" data-k="pre">pre %</th>
      <th class="num sortable" data-k="in">in %</th>
      <th class="num sortable" data-k="post">post %</th>
      <th class="sortable" data-k="sig">variant signature</th>
    </tr></thead><tbody id="pbody"></tbody></table>`;

  let sortKey = "path", sortDir = 1;
  const pct = (f, s) => f[s]?.pct ?? 0;
  const isVariant = r => {
    const ps = ["pre", "in", "post"].map(s => pct(r.f, s));
    return ps.some(p => p >= 1) && ps.some(p => p < 1);
  };
  function render() {
    const q = $("#pfilter").value.toLowerCase();
    const preset = $("#ppreset").value;
    let rows = fields.filter(r => r.path.toLowerCase().includes(q));
    if (preset === "variant") rows = rows.filter(isVariant);
    if (preset === "required") rows = rows.filter(r => ["pre", "in", "post"].every(s => pct(r.f, s) === 100));
    if (preset === "sub") rows = rows.filter(r => ["pre", "in", "post"].some(s => { const p = pct(r.f, s); return p > 0 && p < 1; }));
    rows.sort((a, b) => {
      const va = sortKey === "path" || sortKey === "sig" ? a[sortKey] : pct(a.f, sortKey);
      const vb = sortKey === "path" || sortKey === "sig" ? b[sortKey] : pct(b.f, sortKey);
      return (va < vb ? -1 : va > vb ? 1 : 0) * sortDir;
    });
    $("#pcount").textContent = fmtInt(rows.length) + " shown";
    $("#pbody").innerHTML = rows.map(r => `<tr>
      <td class="mono">${esc(r.path)}</td>
      ${bandCell(pct(r.f, "pre"))}${bandCell(pct(r.f, "in"))}${bandCell(pct(r.f, "post"))}
      <td>${esc(r.sig)}</td></tr>`).join("");
  }
  $("#pfilter").addEventListener("input", render);
  $("#ppreset").addEventListener("change", render);
  document.querySelectorAll("th.sortable").forEach(th => th.addEventListener("click", () => {
    const k = th.dataset.k;
    sortDir = sortKey === k ? -sortDir : 1;
    sortKey = k;
    render();
  }));
  render();
};

/* ---------- discover viewer (tolerates older artifact shapes) */
function treeHtml(node) {
  const stats = [
    node.gain_bits != null ? `gain ${node.gain_bits}` : "",
    node.net_bits != null ? `net ${fmtInt(node.net_bits)} (data ${fmtInt(node.data_bits)} &minus; model ${fmtInt(node.model_bits)})` : "",
    node.leaves != null ? `${node.leaves} leaves` : "",
    node.instances != null ? `${fmtInt(node.instances)} instances` : "",
  ].filter(Boolean).join(" &middot; ");
  const aliases = node.aliases?.length ? ` <span class="muted">(= ${node.aliases.map(esc).join(", ")})</span>` : "";
  const kids = Object.entries(node.classes || {}).map(([cls, info]) => {
    const head = `<span class="mono">${esc(cls)}</span> <span class="muted">${info.pct}% &middot; ${fmtInt(info.count)}</span>`;
    return info.subtree
      ? `<details class="tree-node" open><summary>${head} &rarr;</summary><div class="tree-kids">${treeHtml(info.subtree)}</div></details>`
      : `<div class="leaf">${head}</div>`;
  }).join("");
  return `<details class="tree-node" open><summary><span class="node-head">${esc(node.tag)}</span>${aliases} <span class="node-stats">${stats}</span></summary>${kids}</details>`;
}

views.discover = async function (arg) {
  const picker = await artifactSelect("discover", arg, "discover");
  if (!picker.name) { $("#view").innerHTML = picker.html; return; }
  const doc = await api("/api/artifact/" + encodeURIComponent(picker.name));
  const ranking = doc.ranking || [];
  const trees = doc.trees || [];

  const rankRows = ranking.map((r, i) => {
    const classes = Object.entries(r.classes || {}).map(([cls, info]) =>
      `<span class="chip ${info.below_min_support ? "dim" : ""}">${esc(cls)} ${info.pct}%</span>`).join("");
    const explained = Object.entries(r.top_explained_fields || {}).map(([path, per]) => `<tr>
      <td class="mono">${esc(path)}</td>
      ${Object.entries(per).map(([cls, p]) => `<td class="muted">${esc(cls)}</td>${bandCell(p)}`).join("")}
    </tr>`).join("");
    const detail = `
      ${r.aliases?.length ? `<div>aliases: <span class="mono">${r.aliases.map(esc).join(", ")}</span></div>` : ""}
      ${r.missing_instances ? `<div class="muted">${fmtInt(r.missing_instances)} instances lack this tag (glitch/partial payloads)</div>` : ""}
      ${explained ? `<div class="mini"><table><tbody>${explained}</tbody></table></div>` : ""}`;
    return `<tr>
      <td class="num">${i + 1}</td>
      <td><details><summary class="mono">${esc(r.tag)}</summary>${detail}</details></td>
      <td class="num">${r.gain_bits}</td>
      <td class="num">${r.coverage_pct ?? ""}%</td>
      <td class="num">${r.explained_field_count ?? ""}</td>
      <td>${classes}</td></tr>`;
  }).join("");

  $("#view").innerHTML = `
    ${picker.html}
    <div class="tiles">
      <div class="tile"><div class="v">${esc(doc.league || "?")}</div><div class="k">corpus</div></div>
      <div class="tile"><div class="v">${fmtInt(doc.instances || 0)}</div><div class="k">instances</div></div>
      <div class="tile"><div class="v">${fmtInt(doc.paths || 0)}</div><div class="k">field paths</div></div>
      <div class="tile"><div class="v mono" style="font-size:13px">${esc(doc.instance_path || "(root)")}</div><div class="k">instance path</div></div>
    </div>
    <h2>Candidate ranking</h2>
    ${ranking.length ? `<table><thead><tr>
      <th class="num">#</th><th>tag (expand for detail)</th><th class="num">gain</th>
      <th class="num">coverage</th><th class="num">explains</th><th>classes</th>
    </tr></thead><tbody>${rankRows}</tbody></table>` : `<div class="card">no candidates</div>`}
    <h2>MDL split hierarchies</h2>
    ${trees.length
      ? trees.map((t, i) => `<div class="card"><div class="muted">tree ${i + 1}</div>${treeHtml(t)}</div>`).join("")
      : `<div class="card">No trees — no candidate deterministically explains any field (plain struct with optional fields, or an older artifact; re-run discover).</div>`}`;
};

/* ---------- artifacts index */
views.artifacts = async function () {
  const { files } = await api("/api/artifacts");
  const rows = files.map(f => `<tr>
    <td><a class="mono" href="/api/artifact/${encodeURIComponent(f.name)}" target="_blank">${esc(f.name)}</a></td>
    <td><span class="kind">${esc(f.kind)}</span></td>
    <td class="num">${fmtBytes(f.size)}</td>
    <td class="muted">${new Date(f.mtime * 1000).toLocaleString()}</td></tr>`).join("");
  $("#view").innerHTML = files.length
    ? `<h2>Generated artifacts</h2><table><thead><tr><th>file</th><th>kind</th><th class="num">size</th><th>modified</th></tr></thead><tbody>${rows}</tbody></table>`
    : `<div class="card">No generated artifacts yet.</div>`;
};

route();
</script>
</body>
</html>
