# Mock-ESPN demo config. Copy to tools/espn/mock.yml (gitignored) and edit;
# the running `python -m tools.espn mock` hot-reloads on save.
#
# Point the backend here with:  APP_ESPN__BASE_URL=http://127.0.0.1:8787
#
# Modes per (sport, league):
#   scenario — compose a slate from backend/testdata fixture events.
#              `start_in` (pre-state fixtures only) sets the pregame start,
#              default 60m; live/final fixtures read as "earlier today".
#              A fixture with a paired <name>.summary.json (hockey) serves
#              that body as its summary; otherwise `commentary` serves a
#              soccer-style summary line for that event. Not both.
#   replay   — time-warped re-serve of a captured stream, from the Postgres
#              store (needs ESPN_DB_URL / tools/espn/.env) or an exported
#              .espnbundle (python -m tools.espn bundle ...). `speed` warps
#              time; `loop` restarts after a 60s hold on the final state;
#              `start_offset` jumps into the capture.
version: 1
leagues:
  - name: mlb-demo
    mode: scenario
    sport: baseball
    league: mlb
    events:
      - fixture: mlb/live_inning.json
      - fixture: mlb/pregame.json
        start_in: 90m
      - fixture: mlb/final.json

  - name: nba-in-july
    mode: scenario
    sport: basketball
    league: nba
    events:
      - fixture: nba/in_progress.json
      - fixture: nba/final.json

  # Every hockey screen, twelve different teams. shootout.json is the same
  # game (event id) as final_so_no_stars.json, so the live shootout is
  # another night's.
  - name: nhl-demo
    mode: scenario
    sport: hockey
    league: nhl
    events:
      - fixture: hockey/nhl/pregame.json                    # goalies on the team lines
        start_in: 2h
      - fixture: hockey/nhl/power_play.json                 # UTA 5 on 4
      - fixture: hockey/nhl/end_of_period.json              # the intermission
      - fixture: hockey/nhl/shootout_teamless_attempt.json  # live shootout, 1-1, SEA up
      - fixture: hockey/nhl/final.json                      # three stars
      - fixture: hockey/nhl/final_so_no_stars.json          # just final, no stars yet

  - name: worldcup-demo
    mode: scenario
    sport: soccer
    league: fifa.world
    events:
      - fixture: soccer/fifa.world/live_red_card.json
        commentary: "Red card! Down to ten men after a reckless challenge."

