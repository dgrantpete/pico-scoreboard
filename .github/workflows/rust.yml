name: rust

# Host tests + clippy for the workspace, cross-builds for the device target,
# and size reports on the device binaries (the app, and the hub75-diag bench
# binary). The size numbers land in the job summary as the RAM/flash regression
# signal for firmware-rs/BUDGET.md.
#
# Separate from firmware.yml on purpose: that one builds the MicroPython UF2
# and needs the vendored micropython submodule plus an arm-gcc/cmake toolchain.
# Nothing here does.

on:
  push:
    branches: ["**"]
    paths:
      - "backend/**"
      - "crates/**"
      - "firmware-rs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "backend/**"
      - "crates/**"
      - "firmware-rs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "rust-${{ github.ref }}"
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DEVICE_TARGET: thumbv8m.main-none-eabihf

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # No submodules: the micropython submodule is firmware.yml's business.

      # rust-toolchain.toml pins the channel and already declares the device
      # target and clippy, so rustup materializes all of it here. The explicit
      # adds are idempotent no-ops that keep this job honest if that file ever
      # moves or loses a line.
      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain
          rustup component add clippy
          rustup target add "$DEVICE_TARGET"
          rustc --version
          cargo --version

      # `size` and `nm` for the release ELF. cargo-binutils would work too but
      # costs a from-source install; this is the same tool the BUDGET.md
      # numbers were measured with, so CI and the doc cannot disagree.
      - name: Install arm-none-eabi binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi

      # Downloads only. target/ is deliberately not cached: the size report
      # below is this job's product, and it should never depend on a restored
      # artifact being fresh.
      - name: Cache cargo downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: "cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'firmware-rs/hub75-diag/Cargo.lock', 'firmware-rs/app/Cargo.lock', 'firmware-rs/boot/Cargo.lock') }}"
          restore-keys: |
            cargo-${{ runner.os }}-

      # The app links with flip-link (SPEC §2's stack-overflow guard), so the
      # linker has to exist before the app builds. It shells out to `rust-lld`,
      # which rustc puts on the linker's PATH — no PATH setup needed here.
      - name: Install flip-link
        run: cargo install flip-link --locked

      # --locked throughout: all three lockfiles are committed and the embedded
      # deps are exact-pinned (SPEC.md §14). A stale lockfile is a CI failure,
      # not a silent update.
      - name: Test (host)
        run: cargo test --workspace --locked

      - name: Clippy (host)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build no_std crates for the device target
        run: |
          cargo build --locked --target "$DEVICE_TARGET" \
            -p scoreboard-wire -p scoreboard-model -p hub75 -p scoreboard-render

      # Standalone workspace (embassy-rp is device-only, so it stays out of the
      # root workspace's host builds) — hence its own working-directory and its
      # own Cargo.lock. Its .cargo/config.toml already sets build.target;
      # passing --target keeps the artifact path unambiguous here.
      - name: Build hub75-diag (device binary)
        working-directory: firmware-rs/hub75-diag
        run: cargo build --release --locked --target "$DEVICE_TARGET"

      # `scoreboard-layout` moved to the ROOT workspace in Phase 4 — the
      # bootloader needs the same table, so it belongs to neither device
      # workspace. Its host tests therefore run in the plain `cargo test`
      # above, and no explicit host triple is needed any more.
      - name: Clippy the app workspace
        working-directory: firmware-rs/app
        run: cargo clippy --release --locked --target "$DEVICE_TARGET" -- -D warnings

      # The bootloader. Small, and it has to keep fitting its 32 KB partition —
      # the size report below is the only thing watching that.
      - name: Build + clippy scoreboard-boot (device binary)
        working-directory: firmware-rs/boot
        run: |
          cargo clippy --release --locked --target "$DEVICE_TARGET" -- -D warnings
          cargo build --release --locked --target "$DEVICE_TARGET"

      # Both link profiles, because the whole point of generating memory.x from
      # one constants file is that the Phase 4 flip stays a switch. The
      # standalone build is second so it is the ELF the size report reads.
      #
      # No dev.toml exists here, and that is the point: build.rs falls back to
      # an empty SSID, which is the un-provisioned device. CI must never need
      # credentials to build the firmware.
      - name: Build scoreboard-app (device binary, both link profiles)
        working-directory: firmware-rs/app
        run: |
          cargo build --release --locked --target "$DEVICE_TARGET" \
            --no-default-features --features link-boot-integrated
          cargo build --release --locked --target "$DEVICE_TARGET"

      # `net-probe` is a bench instrument that never ships, so it is checked
      # rather than built — enough to keep it from rotting against the stack it
      # pokes at, without paying for a third link.
      # The OTA install path only exists under `link-boot-integrated`, so the
      # default clippy run above never sees it. It is the code that writes
      # flash and arms a swap; it does not get to be the unlinted half.
      - name: Clippy the boot-integrated profile
        working-directory: firmware-rs/app
        run: |
          cargo clippy --release --locked --target "$DEVICE_TARGET" \
            --no-default-features --features link-boot-integrated -- -D warnings

      - name: Check the net-probe bench feature
        working-directory: firmware-rs/app
        run: cargo clippy --release --locked --target "$DEVICE_TARGET" --features net-probe -- -D warnings

      # No signing key exists in CI and none is needed: the public half is a
      # source constant and the private half never leaves the machine that
      # publishes. This asserts that stays true — a build that started needing
      # a secret would be a build nobody could reproduce.
      # Two separate claims. First: no signing key is present, so a build that
      # started needing one would fail here rather than in a release. (The file
      # is gitignored, but `git add -f` is not.) Second: the signer and the
      # device verifier still agree on the scheme — tests/signature.rs checks
      # that from the Rust side and cannot catch a change to fwsign.py itself,
      # which is what this covers.
      - name: No secret is needed, and the signing scheme still matches
        run: |
          test ! -f backend/.fw-signing-key
          python3 -m pip install --quiet cryptography
          python3 tools/fwsign.py selftest

      - name: Size report — scoreboard-app
        working-directory: firmware-rs/app
        run: |
          elf="target/$DEVICE_TARGET/release/scoreboard-app"
          arm-none-eabi-size -B -d "$elf"
          {
            echo "## scoreboard-app - release, $DEVICE_TARGET, standalone profile"
            echo
            echo '```'
            arm-none-eabi-size -B -d "$elf"
            echo '```'
            echo
            echo "### Largest RAM symbols (.bss / .data)"
            echo
            echo '```'
            arm-none-eabi-nm -C --size-sort -r -S -td "$elf" \
              | awk '$3 ~ /^[bBdD]$/ { if (++n <= 15) printf "%10d  %s  %s\n", $2, $3, $4 }'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Size report — scoreboard-boot
        working-directory: firmware-rs/boot
        run: |
          elf="target/$DEVICE_TARGET/release/scoreboard-boot"
          arm-none-eabi-size -B -d "$elf"
          {
            echo "## scoreboard-boot - release, $DEVICE_TARGET"
            echo
            echo "Must fit the 32,768 B boot partition (firmware-rs/layout)."
            echo
            echo '```'
            arm-none-eabi-size -B -d "$elf"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Size report — hub75-diag
        working-directory: firmware-rs/hub75-diag
        run: |
          elf="target/$DEVICE_TARGET/release/hub75-diag"
          arm-none-eabi-size -B -d "$elf"
          {
            echo "## hub75-diag - release, $DEVICE_TARGET"
            echo
            echo '```'
            arm-none-eabi-size -B -d "$elf"
            echo '```'
            echo
            echo "### Allocated sections"
            echo
            # The release profile keeps debug=2 for probe-rs, so -A also lists
            # .debug_* and a Total that counts them. Neither is on the device;
            # dropping them keeps the flash number from being misread.
            echo '```'
            arm-none-eabi-size -A -d "$elf" \
              | awk '$1 !~ /^(\.debug|\.comment|\.ARM\.attributes|Total)/'
            echo '```'
            echo
            echo "### Largest RAM symbols (.bss / .data)"
            echo
            echo '```'
            arm-none-eabi-nm -C --size-sort -r -S -td "$elf" \
              | awk '$3 ~ /^[bBdD]$/ { if (++n <= 15) printf "%10d  %s  %s\n", $2, $3, $4 }'
            echo '```'
            echo
            echo "Budget of record: \`firmware-rs/BUDGET.md\`. Any PR adding a static >= 1 KB updates that table in the same PR."
          } >> "$GITHUB_STEP_SUMMARY"
