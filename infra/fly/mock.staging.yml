# Staging demo config, baked into the mock-espn image at /app/mock.yml
# (bundle paths resolve relative to this file's baked location, next to
# /app/bundles/). Changing the demo = edit here + redeploy the mock app.
version: 1
leagues:
  - name: mlb-replay
    mode: replay
    sport: baseball
    league: mlb
    source: bundle
    bundle: bundles/mlb_20260719.espnbundle
    speed: 30
    loop: true

  # Every NBA screen, twelve different teams across the first six: the
  # pregame lines, the court through a run, both sides in the bonus, the
  # halftime and overtime bands, the game-leaders final. The playoff final
  # (the series line) repeats SA and NY — the corpus has no other.
  - name: nba-demo
    mode: scenario
    sport: basketball
    league: nba
    events:
      - fixture: basketball/nba/pregame.json          # SA @ POR, the betting lines
        start_in: 2h
      - fixture: basketball/nba/run.json              # WSH @ OKC, OKC on an 8-0 run
      - fixture: basketball/nba/bonus_both.json       # NY @ CLE, both sides in the bonus
      - fixture: basketball/nba/halftime.json         # BKN @ ATL
      - fixture: basketball/nba/overtime.json         # ORL @ GS, period 5
      - fixture: basketball/nba/final.json            # DEN @ IND, game leaders
      - fixture: basketball/nba/final_playoff.json    # SA @ NY, NBA Finals game 4

  # Every college basketball screen, one moment per game (the corpus has
  # several of Tennessee-Radford and Texas-Grambling; a slate takes one
  # each): the rank line and a colourless crest before tip, the opening
  # tip, the court through a run, the end of regulation, a team timeout's
  # flash, an overtime final and the national championship.
  - name: ncaab-demo
    mode: scenario
    sport: basketball
    league: mens-college-basketball
    events:
      - fixture: basketball/mens-college-basketball/pregame_ranked.json      # CP @ #5 ARIZ
        start_in: 2h
      - fixture: basketball/mens-college-basketball/pregame_colourless.json  # WCBC @ BOIS, no colours
        start_in: 3h
      - fixture: basketball/mens-college-basketball/tip.json                 # OAK @ ALA, 0-0
      - fixture: basketball/mens-college-basketball/run.json                 # UNF @ MIA, MIA on an 8-0 run
      - fixture: basketball/mens-college-basketball/end_of_regulation.json   # GRAM @ TEX, 2ND END
      - fixture: basketball/mens-college-basketball/team_timeout.json        # RAD @ TENN, "Radford Timeout"
      - fixture: basketball/mens-college-basketball/final_ot.json            # MISS vs ARK, F/OT
      - fixture: basketball/mens-college-basketball/final_tournament.json    # CONN vs MICH, the title game

  # Every hockey screen, twelve different teams. shootout.json is the same
  # game (event id) as final_so_no_stars.json, so the live shootout is
  # another night's.
  - name: nhl-demo
    mode: scenario
    sport: hockey
    league: nhl
    events:
      - fixture: hockey/nhl/pregame.json                    # goalies on the team lines
        start_in: 2h
      - fixture: hockey/nhl/power_play.json                 # UTA 5 on 4
      - fixture: hockey/nhl/end_of_period.json              # the intermission
      - fixture: hockey/nhl/shootout_teamless_attempt.json  # live shootout, 1-1, SEA up
      - fixture: hockey/nhl/final.json                      # three stars
      - fixture: hockey/nhl/final_so_no_stars.json          # just final, no stars yet

  - name: worldcup-demo
    mode: scenario
    sport: soccer
    league: fifa.world
    events:
      - fixture: soccer/fifa.world/live_red_card.json
        commentary: "Red card! Down to ten men after a reckless challenge."
      - fixture: soccer/fifa.world/pregame.json
        start_in: 2h
